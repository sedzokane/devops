<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Atelier Docker</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #0f172a;
            color: #f8fafc;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .card {
            background: #323b1e;
            padding: 2.5rem;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
            text-align: center;
            max-width: 500px;
            border: 1px solid #334155;
        }

        h1 {
            color: #38bdf8;
            font-size: 2rem;
            margin-bottom: 1rem;
        }

        p {
            color: #94a3b8;
            font-size: 1.1rem;
            line-height: 1.6;
            margin-bottom: 0.8rem;
        }

        .badge {
            display: inline-block;
            margin-top: 1rem;
            padding: 0.4rem 1rem;
            background-color: #0284c7;
            color: #ffffff;
            border-radius: 20px;
            font-weight: bold;
            font-size: 0.9rem;
        }
    </style>
</head>
<body>

    <div class="card">
        <h1>Atelier Docker</h1>
        <p>Bienvenue sur notre application Docker !</p>
        <p>Cette application est exécutée avec succès dans un conteneur Node.js.</p>
        <span class="badge">Conteneur Actif 🚀</span>
    </div>

</body>
</html>
